name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/SprintFlow.Api/SprintFlow.Api.csproj
      - run: dotnet test tests/SprintFlow.Tests

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/SprintFlow.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/SprintFlow.Web/package-lock.json
      - run: npm ci
      - run: npm run build
